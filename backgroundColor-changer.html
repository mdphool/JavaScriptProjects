<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: lightskyblue;
            
        }
        #myDiv{
            height: 400px;
            min-width: 500px;
            /* background-color: red; */
            align-content: center; /* Centers vertically */
            text-align: center; 
            border: 1px solid black;
            border-radius: 10px;
        }

        h1{
            font-family: Arial, Helvetica, sans-serif;
            color: #fafafa
          
        }
        
        button{
            transition: background-color 0.5s ease;
            cursor: pointer;
            border-radius: 5px;
            padding: 10px 20px;
            background-color: white;
            color: black;
            border: none;
            font-weight: bold;


        }
        button:hover{
            background-color: black;
            color: white;
            

        }

    </style>
</head>
<body>

       <div id="myDiv">
            <h1>🎨 Color Switcher</h1>
         <button onclick="colorChanger()">Change Now</button>
       </div>
    
    <script>
        const color = ["Red", "Green", "Pink", "Black", "Purple", "Yellow", "Cyan", "Orange", "Blue", "Violet", "Brown"];
        const div = document.getElementById("myDiv");

        const colorChanger = function(){
            const radnomColor =  Math.floor(Math.random()*color.length);
            div.style.backgroundColor = color[radnomColor]
            
        }

    </script>
    
</body>
</html>
