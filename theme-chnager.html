<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Changer</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #dbeafe;
            color: black;
            transition: background-color 0.5s ease, color 0.5s ease;
            font-family: math;
        }

        #myBody.dark {
            background-color: #0f172a;
            color: white;
        }

        #myDiv {
            height: 58px;
            width: 158px;
            background-color: #e5e7eb;
            cursor: pointer;
            position: relative;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .on {
            background-color: #facc15 !important;
        }

        .on #circle {
            left: 103px;
        }

        #circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            left: 4px;
            top: 4px;
            transition: 0.5s;
            position: absolute;
            background: white;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.18),
                inset 0 2px 5px rgba(255, 255, 255, 0.7);
        }

        #status {
            height: 24px;
            margin: 10px 0 5px;
        }
    </style>
</head>

<body id="myBody">

    <div id="myDiv">
        <div id="circle">🌙</div>
    </div>

    <p id="status">🌙 Off</p>

    <div class="hint">Click to change theme</div>

    <script>
        const div = document.getElementById("myDiv");
        const circle = document.getElementById("circle");
        const status = document.getElementById("status");
        const myBody = document.getElementById("myBody");

        div.addEventListener("click", function () {

            div.classList.toggle("on");
            myBody.classList.toggle("dark");

            if (myBody.classList.contains("dark")) {
                circle.innerText = "☀️";
                status.innerHTML = "☀️ Light";
            }

            else {
                circle.innerText = "🌙";
                status.innerHTML = "🌙 Dark";
            }
        });
    </script>

</body>

</html>
